[project]
name = "fendomental"
version = "0.1.0"
description = "Standalone daily fundamental/macro Bias forecaster for NQ (Nasdaq E-mini futures)."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "apscheduler>=3.10",
    "pandas>=2.2",
    "pandas-market-calendars>=4.4",
    "yfinance>=0.2.40",
    "anthropic>=0.34",
    "requests>=2.32",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "streamlit>=1.37",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
